    <header>
      <div class="header-top">
        <div class="site-brand">
          <h1><a href="index.html">Arthur Chang</a></h1>
        </div>
        <div class="nav-group">
          <nav>
            <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="blog.html">Blog</a></li>
            <li><a href="playbook.html">Playbook</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
          </nav>
          <button class="theme-toggle" aria-label="Toggle theme">
            <svg class="icon-sun" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
            <svg class="icon-moon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="section-block animate-on-scroll" style="border-top:none; margin-top:0; padding-top:0;">
        <div class="section-header">
          <h3>Contact</h3>
        </div>

        <div class="contact-grid stagger">
          <a href="mailto:arthur@example.com" class="contact-card animate-on-scroll" style="text-decoration:none;">
            <div class="label">Email</div>
            <div class="value">arthur@example.com</div>
          </a>
          <a href="https://www.linkedin.com/in/arthurchangcpa" target="_blank" class="contact-card animate-on-scroll" style="text-decoration:none;">
            <div class="label">LinkedIn</div>
            <div class="value">in/arthurchangcpa</div>
          </a>
          <a href="https://www.instagram.com/ayo.chill.out" target="_blank" class="contact-card animate-on-scroll" style="text-decoration:none;">
            <div class="label">Instagram</div>
            <div class="value">@ayo.chill.out</div>
          </a>
          <a href="https://open.spotify.com/user/s2gosrk3t6dteqrxak48hhbz8" target="_blank" class="contact-card animate-on-scroll" style="text-decoration:none;">
            <div class="label">Spotify</div>
            <div class="value">Arthur's Playlists</div>
          </a>
        </div>
      </section>

      <section class="section-block animate-on-scroll">
        <div class="contact-form-section">
          <h3>Or send a message</h3>
          <form action="#" method="post">
            <div>
              <label for="name">Name</label>
              <input type="text" id="name" name="name" required>
            </div>
            <div>
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required>
            </div>
            <div>
              <label for="message">Message</label>
              <textarea id="message" name="message" required></textarea>
            </div>
            <button type="submit">Send message</button>
          </form>
        </div>
      </section>
    </main>

    <footer>
      <div class="footer-links">
        <a href="https://github.com/arthurchang" target="_blank">GitHub</a>
        <a href="https://www.linkedin.com/in/arthurchangcpa" target="_blank">LinkedIn</a>
        <a href="https://www.instagram.com/ayo.chill.out" target="_blank">Instagram</a>
        <a href="https://open.spotify.com/user/s2gosrk3t6dteqrxak48hhbz8" target="_blank">Spotify</a>
        <a href="mailto:arthur@example.com">Email</a>
      </div>

    </footer>
